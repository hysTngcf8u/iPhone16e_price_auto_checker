name: iPhone 16e Price Tracker

on:
schedule:
# GitHub Actions の cron は UTC（協定世界時）表記です（JST - 9時間）
# 8:08 JST  -> 23:08 UTC (前日)
# 12:08 JST -> 03:08 UTC
# 18:18 JST -> 09:18 UTC
- cron: '8 23 * * *'
- cron: '8 3 * * *'
- cron: '18 9 * * *'
workflow_dispatch: # 手動でいつでもテスト実行可能にするボタンを追加

jobs:
track-price:
runs-on: ubuntu-latest
permissions:
contents: write # CSVファイルを自動更新してコミットするためにリポジトリ書き込み権限を付与

steps:
  - name: リポジトリのチェックアウト
    uses: actions/checkout@v4

  - name: Python環境のセットアップ
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: 必要なライブラリのインストール
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 matplotlib

  - name: 価格チェックと通知の実行
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    run: python iphone_price_checker.py

  - name: 更新されたCSVとグラフをGitHubにコミットして保存
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add prices.csv price_trend_chart.png
      git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update price data [skip ci]" && git push)