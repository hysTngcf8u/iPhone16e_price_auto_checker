name: iPhone 16e Price Tracker

on:
  schedule:
    # UTC時間で設定 (日本時間 8:08, 12:08, 18:18)
    - cron: '8 23 * * *'
    - cron: '8 3 * * *'
    - cron: '18 9 * * *'
  workflow_dispatch:

jobs:
  track-price:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 matplotlib

      - name: Run price checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python iphone_price_checker.py

      - name: Commit and push updated prices.csv
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices.csv [skip ci]" && git push)
